<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rounak Bera</title>
<meta name="description" content="Rounak Bera: links to GitHub, LinkedIn and more, on a hand-generated pixel forest.">
<style>
/* Layout: full-bleed pixel forest (canvas sized to the screen in chunky pixels, sky follows local time) under one parchment card */
:root {
  color-scheme: dark;
  --ink: #3a2414;
  --ink-soft: #6b4528;
  --parch: #ecd7a6;
  --parch-hi: #f7eac8;
  --parch-lo: #cfa96c;
  --night: #0a0c26;
  --px: 4px;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); overflow-x: hidden; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; image-rendering: pixelated; display: block; }
.stage { position: relative; min-height: 100%; box-sizing: border-box; display: grid; place-items: center; padding-inline: 16px; padding-block: 40px; }
.card-wrap { width: 100%; max-width: 620px; filter: drop-shadow(8px 8px 0 rgba(8, 6, 28, .45)); animation: drop .5s steps(5) both; }
@keyframes drop { from { transform: translateY(-28px); } to { transform: none; } }
.card {
  position: relative; box-sizing: border-box; display: flex; align-items: center; gap: 28px; padding: 30px 34px;
  background-color: var(--parch); background-image: var(--grain, none); background-size: 192px 192px; image-rendering: pixelated;
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ink), 0 var(--px) 0 0 var(--ink), calc(-1 * var(--px)) 0 0 0 var(--ink), var(--px) 0 0 0 var(--ink),
    inset var(--px) var(--px) 0 0 var(--parch-hi), inset calc(-1 * var(--px)) calc(-1 * var(--px)) 0 0 var(--parch-lo);
}
.card::before { content: ""; position: absolute; inset: 12px; border: 2px solid rgba(106, 69, 40, .22); pointer-events: none; }
.portrait { flex: none; width: 144px; height: 144px; padding: 6px; cursor: pointer; background: var(--parch-lo); box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--ink), 0 var(--px) 0 0 var(--ink), calc(-1 * var(--px)) 0 0 0 var(--ink), var(--px) 0 0 0 var(--ink); }
.portrait canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.ident { min-width: 0; display: grid; gap: 20px; }
h1 { margin: 0; line-height: 0; color: var(--ink); cursor: pointer; justify-self: start; }
/* the name is baked from Jersey 10, 15, 20 and 25; all share one cap height, so stepping through them sharpens it */
.ident { --cap: 40px; }
h1 { position: relative; }
.name { display: block; height: calc(var(--cap) * var(--r)); width: auto; max-width: none; transition: none; }
/* Jersey 10 stays in the flow and sizes the heading; the sharper cuts are layered on top, so the links never move */
.name ~ .name { position: absolute; top: 0; left: 0; opacity: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: nowrap; gap: 14px; }
.links a {
  position: relative; display: grid; place-items: center; width: 44px; height: 44px; color: var(--ink); background: var(--parch-hi);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--parch-lo);
  transition: transform .12s steps(2);
}
/* hover is tracked on the list slot, which never moves, so the lifted button can't slide out from under the pointer */
.links li { display: block; }
.links li:hover > a, .links a:focus-visible { transform: translateY(-4px); color: var(--ink-soft); }
.links a:focus-visible { outline: 3px dashed var(--ink); outline-offset: 6px; }
.links li:hover > a:active, .links a:active { transform: translateY(0); }
/* the link's clickable area covers its drawn ink border and reaches 4 px further down,
   so the strip a lifted button leaves behind still counts as the button */
.links a::after { content: ""; position: absolute; inset: -3px -3px -7px -3px; }
.tip { position: absolute; top: calc(100% + 8px); left: -3px; line-height: 0; color: var(--parch-hi); background: var(--ink); padding: 3px 4px; pointer-events: none; visibility: hidden; }
.links li:hover > a .tip, .links a:focus-visible .tip, .links a.copied .tip { visibility: visible; }
.tip .clip { display: block; overflow: hidden; width: var(--w); }
.tip .clip[hidden] { display: none; }
.tip svg { display: block; }
/* typed in left to right, one character per step; the dark box grows with the text */
@keyframes type { from { width: 0; } to { width: var(--w); } }
/* the email label hangs from the button's right edge and types right to left: the box grows leftward,
   revealing the end of the text first, so it stays on screen in every layout */
.links li:last-child .tip { left: auto; right: -3px; }
.links li:last-child .clip { display: flex; justify-content: flex-end; }
.links li:last-child .clip[hidden] { display: none; }
.links li:last-child .tip svg { flex: none; }
.links li:hover > a .clip, .links a:focus-visible .clip, .links a.copied .clip { animation: type calc(var(--n) * 22ms) steps(var(--n), end) both; }

/* stack once the side-by-side card no longer fits on one line (portrait + name + padding + page gutters) */
@media (max-width: 660px) {
  .card-wrap { width: max-content; max-width: 100%; }
  .card { flex-direction: column; text-align: center; padding: 28px 22px; gap: 22px; }
  .ident { --cap: 30px; }
  .name { margin-inline: auto; }
  .name ~ .name { left: 50%; transform: translateX(-50%); }
  .links { justify-content: center; }
}
/* very small phones: a slightly smaller name and tighter padding so the stacked card still fits */
@media (max-width: 340px) { .ident { --cap: 26px; } .card { padding-inline: 14px; } }
/* easter egg: click the name or portrait for a little time-of-day panel in the top-left corner */
.timepanel {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 5;
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; box-sizing: border-box; max-width: calc(100% - 32px);
  background: var(--parch); color: var(--ink);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--parch-lo);
  filter: drop-shadow(6px 6px 0 rgba(8, 6, 28, .45)); animation: tp-in .35s steps(7) both;
}
/* slides down from above the top edge of the screen; closing fades it out in place */
@keyframes tp-in { from { transform: translateY(calc(-100% - 40px)); } to { transform: none; } }
@keyframes tp-out { from { opacity: 1; } to { opacity: 0; } }
.timepanel.closing { animation: tp-out .25s ease-out both; pointer-events: none; }
.timepanel[hidden] { display: none; }
.tp-clock { display: block; flex: none; }
.tp-btn { flex: none; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; cursor: pointer; color: var(--ink); background: var(--parch-hi);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--parch-lo); }
.tp-btn:hover { color: var(--ink-soft); transform: translateY(-2px); }
.tp-btn:focus-visible, #tp-range:focus-visible { outline: 2px dashed var(--ink); outline-offset: 4px; }
#tp-range { -webkit-appearance: none; appearance: none; width: 120px; min-width: 0; flex: 1 1 auto; height: 14px; margin: 0; background: transparent; cursor: pointer; }
#tp-range::-webkit-slider-runnable-track { height: 3px; background: var(--ink); }
#tp-range::-moz-range-track { height: 3px; background: var(--ink); }
#tp-range::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 14px; margin-top: -5.5px; border: 0; background: var(--parch-hi); box-shadow: 0 0 0 2px var(--ink); }
#tp-range::-moz-range-thumb { width: 8px; height: 14px; border: 0; border-radius: 0; background: var(--parch-hi); box-shadow: 0 0 0 2px var(--ink); }
@media (prefers-reduced-motion: reduce) { .card-wrap { animation: none; } .links a { transition: none; } }
</style>
</head>

      }
    }
    for (let i = 3; i < fg.length; i += 4) if (fg[i]) { d[i - 3] = fg[i - 3]; d[i - 2] = fg[i - 2]; d[i - 1] = fg[i - 1]; }
    g.putImageData(img, 0, 0);
  }


  /* ---------- site runtime ---------- */
  const canvas = document.getElementById('world');
  // a new forest every visit; #seed-104 in the address pins one
  // #seed-104 pins a forest, #winter (or #seed-104-winter) pins a season; otherwise the season follows the calendar
  const mh = /seed-(\d{1,6})/.exec(location.hash);
  let seed = mh ? +mh[1] : 1 + Math.floor(Math.random() * 99999);
  const ms = /spring|summer|autumn|winter/.exec(location.hash);
  SEASON = ms ? ms[0] : seasonOf();
  // the sky's motion is a pixel every few seconds, gentle enough to keep even with reduced motion on (the card's drop-in still respects it)
  const t0 = performance.now();
  let override = null;   // set by the time panel; null = follow the real clock
  const realHours = () => { const d = new Date(); return d.getHours() + d.getMinutes() / 60; };
  const hoursNow = () => override ?? realHours();
  let plan = planFor(seed);
  const scene = { world: flatten(buildWorld(seed), WW, WH), front: null, clouds: buildClouds(seed) };
  makeStars();
  let prep = null, minute = -1;
  const secs = () => (performance.now() - t0) / 1000;
  // size the scene to the screen;
  // only the front is rebuilt when the size changes, so this can run on every resize frame
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    // continuous pixel size: the scene is 180 px tall on wide screens and 200 px wide on tall ones, and the
    // two meet at the same value, so resizing zooms smoothly with no jumps (min() picks whichever fits)
    const S = Math.max(1, Math.min(vh / 180, vw / 200));
    const w = Math.round(vw / S), h = Math.max(180, Math.round(vh / S));
    if (scene.front && w === W && h === H) return false;
    W = w; H = h; YO = H - 180; PX = S;
    canvas.width = W; canvas.height = H;
    // the card's top edge (layout position, ignoring the drop-in animation)
    SKYB = Math.max(40, Math.min(YO + 112, Math.floor(document.querySelector('.card-wrap').offsetTop / S) - 6));
    scene.front = flatten(buildFront(seed, plan), W, H);
    const ox = (WW >> 1) - (W >> 1);
    MAX_LIT = Math.max(1, Math.round(STARS.filter(s => s.x - ox >= 0 && s.x - ox < W && YO + 108 - s.d >= 0).length * .05));
    minute = -1;
    return true;
  }
  function frame() {
    const t = hoursNow(), mk = Math.floor(t * 60);
    if (mk !== minute) { minute = mk; prep = prepare(scene, t); }   // sky, sun and moon move once a minute
    draw(canvas, scene, prep, secs());                              // clouds and stars on their own half-second beats
  }
  fit();
  // redraw on every animation frame while the window is being resized
  let queued = false;
  addEventListener('resize', () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; if (fit()) frame(); }); });
  frame();
  // a new season: same seed, so the same forest, rebuilt with that season's trees, ground cover and clouds
  function setSeason(sn) {
    SEASON = sn;
    scene.world = flatten(buildWorld(seed), WW, WH); scene.clouds = buildClouds(seed); scene.front = null;
    fit(); minute = -1; frame();
  }
  setInterval(() => { if (!document.hidden) frame(); }, 500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) frame(); });

  /* ---------- easter egg: time panel ---------- */
  {
    // Jersey 10 digits baked to pixel paths: [advance, path]; each digit is centred in an 8 px cell so the clock never jitters
    const DIG = {"0":[7,"M1 0h4v1h-4zM0 1h6v1h-6zM0 2h2v1h-2zM4 2h2v1h-2zM0 3h2v1h-2zM4 3h2v1h-2zM0 4h2v1h-2zM4 4h2v1h-2zM0 5h2v1h-2zM4 5h2v1h-2zM0 6h2v1h-2zM4 6h2v1h-2zM0 7h2v1h-2zM4 7h2v1h-2zM0 8h6v1h-6zM1 9h4v1h-4z"],"1":[4,"M0 0h3v1h-3zM0 1h3v1h-3zM1 2h2v1h-2zM1 3h2v1h-2zM1 4h2v1h-2zM1 5h2v1h-2zM1 6h2v1h-2zM1 7h2v1h-2zM1 8h2v1h-2zM1 9h2v1h-2z"],"2":[8,"M1 0h5v1h-5zM0 1h7v1h-7zM0 2h2v1h-2zM5 2h2v1h-2zM4 3h3v1h-3zM3 4h3v1h-3zM2 5h3v1h-3zM1 6h3v1h-3zM0 7h3v1h-3zM0 8h7v1h-7zM0 9h7v1h-7z"],"3":[8,"M1 0h5v1h-5zM0 1h7v1h-7zM0 2h2v1h-2zM5 2h2v1h-2zM5 3h2v1h-2zM2 4h4v1h-4zM2 5h4v1h-4zM5 6h2v1h-2zM0 7h2v1h-2zM5 7h2v1h-2zM0 8h7v1h-7zM1 9h5v1h-5z"],"4":[7,"M4 0h2v1h-2zM3 1h3v1h-3zM2 2h4v1h-4zM1 3h2v1h-2zM4 3h2v1h-2zM0 4h2v1h-2zM4 4h2v1h-2zM0 5h2v1h-2zM4 5h2v1h-2zM0 6h6v1h-6zM0 7h6v1h-6zM4 8h2v1h-2zM4 9h2v1h-2z"],"5":[7,"M0 0h6v1h-6zM0 1h6v1h-6zM0 2h2v1h-2zM0 3h2v1h-2zM0 4h5v1h-5zM1 5h5v1h-5zM4 6h2v1h-2zM0 7h2v1h-2zM4 7h2v1h-2zM0 8h6v1h-6zM1 9h4v1h-4z"],"6":[8,"M1 0h5v1h-5zM0 1h7v1h-7zM0 2h2v1h-2zM5 2h2v1h-2zM0 3h2v1h-2zM0 4h6v1h-6zM0 5h7v1h-7zM0 6h2v1h-2zM5 6h2v1h-2zM0 7h2v1h-2zM5 7h2v1h-2zM0 8h7v1h-7zM1 9h5v1h-5z"],"7":[7,"M0 0h6v1h-6zM0 1h6v1h-6zM4 2h2v1h-2zM4 3h2v1h-2zM3 4h3v1h-3zM2 5h3v1h-3zM2 6h3v1h-3zM2 7h2v1h-2zM2 8h2v1h-2zM2 9h2v1h-2z"],"8":[8,"M1 0h5v1h-5zM0 1h7v1h-7zM0 2h2v1h-2zM5 2h2v1h-2zM0 3h2v1h-2zM5 3h2v1h-2zM1 4h5v1h-5zM0 5h7v1h-7zM0 6h2v1h-2zM5 6h2v1h-2zM0 7h2v1h-2zM5 7h2v1h-2zM0 8h7v1h-7zM1 9h5v1h-5z"],"9":[8,"M1 0h5v1h-5zM0 1h7v1h-7zM0 2h2v1h-2zM5 2h2v1h-2zM0 3h2v1h-2zM5 3h2v1h-2zM0 4h7v1h-7zM1 5h6v1h-6zM5 6h2v1h-2zM0 7h2v1h-2zM5 7h2v1h-2zM0 8h7v1h-7zM1 9h5v1h-5z"],":":[3,"M0 2h2v1h-2zM0 3h2v1h-2zM0 8h2v1h-2zM0 9h2v1h-2z"]}, DH = 10;
    const panel = document.getElementById('timepanel'), range = document.getElementById('tp-range'), clockSvg = document.getElementById('tp-clock');
    const pad = (n) => String(n).padStart(2, '0');
    function showClock(t) {
      const m = Math.round(t * 60) % 1440, txt = pad(Math.floor(m / 60)) + ':' + pad(m % 60);
      let x = 0, paths = '';
      for (const ch of txt) {
        const [adv, d] = DIG[ch], cell = ch === ':' ? 3 : 8, off = Math.floor((cell - adv) / 2);
        paths += `<path transform="translate(${x + off} 0)" d="${d}" fill="currentColor"/>`; x += cell + 1;
      }
      clockSvg.setAttribute('viewBox', `0 0 ${x - 1} ${DH}`); clockSvg.setAttribute('width', (x - 1) * 1.5);
      clockSvg.innerHTML = paths; clockSvg.setAttribute('aria-label', txt);
    }
    function setTime(t) { override = t; minute = -1; frame(); showClock(t); }
    let closing = 0;
    function open() { clearTimeout(closing); panel.classList.remove('closing'); panel.hidden = false; range.value = Math.round(hoursNow() * 60) % 1440; showClock(hoursNow()); }
    function close() { if (panel.hidden || panel.classList.contains('closing')) return; panel.classList.add('closing'); closing = setTimeout(() => { panel.hidden = true; panel.classList.remove('closing'); }, 250); }
    for (const el of [document.querySelector('.portrait'), document.querySelector('h1')]) el.addEventListener('click', open);
    range.addEventListener('input', () => setTime(range.value / 60));
    // season button: shows the current season's icon and steps to the next one
    const SICON = {"spring": "M2 0h2v1h-2zM5 0h2v1h-2zM1 1h7v1h-7zM1 2h2v1h-2zM6 2h2v1h-2zM2 3h1v1h-1zM6 3h1v1h-1zM1 4h2v1h-2zM6 4h2v1h-2zM1 5h7v1h-7zM2 6h2v1h-2zM5 6h2v1h-2zM4 7h1v1h-1zM3 8h2v1h-2z", "summer": "M4 0h1v1h-1zM1 1h1v1h-1zM7 1h1v1h-1zM3 2h3v1h-3zM2 3h5v1h-5zM0 4h1v1h-1zM2 4h5v1h-5zM8 4h1v1h-1zM2 5h5v1h-5zM3 6h3v1h-3zM1 7h1v1h-1zM7 7h1v1h-1zM4 8h1v1h-1z", "autumn": "M5 0h4v1h-4zM3 1h6v1h-6zM2 2h4v1h-4zM7 2h2v1h-2zM1 3h4v1h-4zM6 3h3v1h-3zM1 4h3v1h-3zM5 4h4v1h-4zM1 5h2v1h-2zM4 5h4v1h-4zM2 6h1v1h-1zM4 6h3v1h-3zM1 7h1v1h-1zM0 8h1v1h-1z", "winter": "M4 0h1v1h-1zM1 1h1v1h-1zM4 1h1v1h-1zM7 1h1v1h-1zM2 2h1v1h-1zM4 2h1v1h-1zM6 2h1v1h-1zM3 3h3v1h-3zM0 4h9v1h-9zM3 5h3v1h-3zM2 6h1v1h-1zM4 6h1v1h-1zM6 6h1v1h-1zM1 7h1v1h-1zM4 7h1v1h-1zM7 7h1v1h-1zM4 8h1v1h-1z"}, sBtn = document.getElementById('tp-season');
    const showSeason = () => { sBtn.querySelector('path').setAttribute('d', SICON[SEASON]); sBtn.setAttribute('aria-label', 'Season: ' + SEASON + ' (next: ' + SEASONS[(SEASONS.indexOf(SEASON) + 1) % 4] + ')'); sBtn.title = SEASON; };
    showSeason();
    // dice: a brand-new forest (new seed), same season and time
    document.getElementById('tp-reseed').addEventListener('click', () => { seed = 1 + Math.floor(Math.random() * 99999); plan = planFor(seed); setSeason(SEASON); });
    sBtn.addEventListener('click', () => { setSeason(SEASONS[(SEASONS.indexOf(SEASON) + 1) % 4]); showSeason(); });
    document.getElementById('tp-reset').addEventListener('click', () => { override = null; if (SEASON !== seasonOf()) { setSeason(seasonOf()); showSeason(); } minute = -1; frame(); const t = realHours(); range.value = Math.round(t * 60); showClock(t); });
    document.getElementById('tp-close').addEventListener('click', close);
    addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) close(); });
    // keep the clock ticking while the panel shows real time
    setInterval(() => { if (!panel.hidden && override === null) { const t = realHours(); range.value = Math.round(t * 60); showClock(t); } }, 15000);
  }
})();
